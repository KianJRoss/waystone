<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self' blob:;">
  <title>Waystone Xbox Voice Media Component</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #ccc;
    }
    body {
      margin: 0;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      background: #2a2a2a;
      color: #888;
    }
    .badge.connected { background: #1b4d2e; color: #4ade80; }
    .badge.muted { background: #4d2b1b; color: #fb923c; }
    .badge.error { background: #4d1b1b; color: #f87171; }
    .status-line { margin: 8px 0; }
    #log {
      margin-top: 12px;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div>
    <strong>Xbox Voice Component</strong>
    <span id="badge" class="badge">Idle / Disconnected</span>
  </div>
  <div class="status-line">
    <span id="mic-status">Microphone: Disabled (Hardware Stopped)</span>
  </div>
  <div id="log">Component initialized. Audio hardware idle. Zero ambient network/mic activity.</div>

  <!--
    NOTE ON TRANSPORT BINDING:
    QtWebChannel transport is the planned native integration binding for the Python/Qt host.
    The postMessage interface with per-instance session nonces below serves as the sandboxed
    message prototype and unit testing harness. It does not certify production native Qt wiring.
  -->
  <script type="module">
    import { XboxVoiceEngine, attachVoiceBridge, sanitizeError } from './xbox_voice_engine.js';
    import { generateSessionNonce, createNativeBridgeProxy } from './voice_transport.js';

    const badge = document.getElementById('badge');
    const micStatus = document.getElementById('mic-status');
    const logEl = document.getElementById('log');

    function appendLog(msg) {
      const sanitized = String(msg).replace(/[\x00-\x1f\x7f]/g, ' ').slice(0, 128);
      const line = `[${new Date().toISOString().substring(11, 19)}] ${sanitized}`;
      logEl.textContent = `${line}\n${logEl.textContent}`.slice(0, 2048);
    }

    try {
      // Fails closed immediately if crypto or getRandomValues is unavailable
      const instanceNonce = generateSessionNonce(window.crypto);

      const bridgeProxy = createNativeBridgeProxy({
        transport: window.parent,
        nonce: instanceNonce
      });

      const engine = new XboxVoiceEngine(bridgeProxy.api, (state) => {
        const safeError = sanitizeError(state.error);
        if (state.connected) {
          badge.textContent = state.muted ? 'Connected (Muted)' : 'Connected (Live)';
          badge.className = `badge connected ${state.muted ? 'muted' : ''}`;
        } else {
          badge.textContent = safeError ? `Error: ${safeError}` : 'Idle / Disconnected';
          badge.className = safeError ? 'badge error' : 'badge';
        }
        micStatus.textContent = state.muted
          ? 'Microphone: Disabled (Hardware Stopped)'
          : 'Microphone: Active (Transmitting Opus)';
        appendLog(`State: connected=${state.connected}, muted=${state.muted}, error=${safeError || 'none'}`);
      });

      window.addEventListener('message', (event) => {
        bridgeProxy.handleParentReply(event.data);
      });

      window.addEventListener('unload', () => {
        bridgeProxy.teardown();
        engine.closeMedia();
      });

      const bridge = attachVoiceBridge(engine, { transport: window.parent, nonce: instanceNonce });
      window.voiceEngine = engine;
      window.voiceBridge = bridge;
      window.voiceProxy = bridgeProxy;
    } catch (initErr) {
      const code = sanitizeError(initErr);
      badge.textContent = `Error: ${code}`;
      badge.className = 'badge error';
      appendLog(`Initialization failure: ${code}`);
    }
  </script>
</body>
</html>
