name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (Python + QML, offscreen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb
      - name: Test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run -q --with-requirements requirements-test.txt python -m pytest -q -p no:cacheprovider tests craft-projects/playnite-desktop/app
      - name: Controller QML tests
        run: bash craft-projects/playnite-desktop/app/controller_native/run_tests.sh

  engine:
    name: Controller engine (.NET 10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: libevdev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libevdev2
      - name: Build and test (fixtures only, no devices)
        run: bash components/controller_studio/src/headless/run_tests.sh
