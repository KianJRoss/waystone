name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (Python + QML, offscreen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb \
            libarchive-tools
      - name: Test suite (native Linux)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run -q --with-requirements requirements-test.txt python -m pytest -q -p no:cacheprovider tests craft-projects/playnite-desktop/app
      - name: Windows compatibility simulation (POSIX-only imports blocked)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ".:craft-projects/playnite-desktop:craft-projects/playnite-desktop/app"
        run: uv run -q --with-requirements requirements-test.txt python -m pytest -q -p no:cacheprovider -p tests.windows_compat_guard -m "not linux_only" tests craft-projects/playnite-desktop/app
      - name: Controller QML tests
        run: bash craft-projects/playnite-desktop/app/controller_native/run_tests.sh

  windows-platform:
    name: Windows app and platform suite
    runs-on: windows-latest
    # The previous run spent 4h38m in pytest before cancellation. Bound the whole
    # job and each individual test so a hung child/process poll cannot pin a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Platform-independent Windows tests
        env:
          PYTHONPATH: ".;craft-projects/playnite-desktop;craft-projects/playnite-desktop/app"
          QT_QPA_PLATFORM: offscreen
        run: uv run --with-requirements requirements-test.txt python -m pytest -q -p no:cacheprovider --timeout=60 --durations=30 tests/test_platform.py
      - name: Cross-platform suite (explicit Linux-only transport tests excluded)
        env:
          PYTHONPATH: ".;craft-projects/playnite-desktop;craft-projects/playnite-desktop/app"
          QT_QPA_PLATFORM: offscreen
        run: uv run --with-requirements requirements-test.txt python -m pytest -q -p no:cacheprovider --timeout=60 --durations=30 -m "not linux_only" tests craft-projects/playnite-desktop/app
      - name: Import application modules on Windows
        env:
          PYTHONPATH: ".;craft-projects/playnite-desktop;craft-projects/playnite-desktop/app"
          QT_QPA_PLATFORM: offscreen
        run: uv run --with-requirements requirements-test.txt python -c "import app; from native_services import game_process_tracker, game_launcher, waystone_paths, waystone_control, file_locking, install_receipts, artwork_overrides, xodus_install, windows_catalog, launcher_library; print('Waystone Windows import smoke passed')"
      - name: Start and exercise the app offscreen
        env:
          PYTHONPATH: ".;craft-projects/playnite-desktop;craft-projects/playnite-desktop/app"
          QT_QPA_PLATFORM: offscreen
        run: uv run --with-requirements requirements-test.txt python craft-projects/playnite-desktop/app/app.py --smoke-test

  engine:
    name: Controller engine (.NET 10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: libevdev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libevdev2
      - name: Build and test (fixtures only, no devices)
        run: bash components/controller_studio/src/headless/run_tests.sh

  packages:
    name: Linux packages (AppImage, .deb, .rpm)
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used to attach packages to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Packaging & X11/Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools libevdev2 libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libasound2t64 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 xvfb \
            libpulse0 libpulse-mainloop-glib0 libxkbfile1 libxshmfence1 libgbm1 libdrm2 libxcb-randr0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libva2 libva-drm2
      - name: Version from the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WAYSTONE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build AppImage
        run: bash packaging/appimage/build_appimage.sh --output-dir dist
      - name: Smoke-test AppImage offscreen
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: ./dist/Waystone-*-x86_64.AppImage --smoke-test
      - name: Build .deb and .rpm packages (nfpm)
        run: bash packaging/nfpm/build_deb_rpm.sh --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: waystone-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
      - name: Attach packages to the GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Waystone ${GITHUB_REF_NAME#v}" --notes "See the README for install steps."
          gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb dist/*.rpm --clobber
